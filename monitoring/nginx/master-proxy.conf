worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # Docker Compose's embedded DNS (127.0.0.11) resolves the `master`
    # service name to one A record per running replica, same mechanism
    # Prometheus's DNS service discovery uses for `worker` - short
    # valid= so scaling up/down (or a replica dying) is picked up fast
    # rather than nginx caching a stale replica list.
    resolver 127.0.0.11 valid=5s;

    # Flask's own MAX_CONTENT_LENGTH is 50MB (master/app.py) - nginx's
    # 1MB default would reject valid uploads before they even reach it.
    client_max_body_size 55m;

    server {
        listen 80;

        location / {
            # A variable in proxy_pass, not a static upstream{} block, is
            # what forces nginx to re-resolve `master` on every request
            # rather than once at config-load time - a static upstream
            # would never notice a scale-up/down or a dead replica being
            # replaced without an nginx reload.
            set $master_upstream http://master:5000;
            proxy_pass $master_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # /upload does real work (tiling, threaded MinIO PUTs, Kafka
            # publish) before responding - not an instant proxy pass-through.
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
